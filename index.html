<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Node — Sort Spectrum</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>↕ atlas node — sort spectrum</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="algo">Algorithm</h2><div class="btncol" id="algos"></div></section>
<section><h2 data-i="controls">Controls</h2><div class="btncol">
<button id="run" class="primary" data-i="run">▶ Visualize</button>
<button id="shuffle" data-i="shuffle">🎲 Shuffle</button>
<button id="reset" data-i="reset">↺ Reset</button></div></section>
<section><h2 data-i="params">Parameters</h2>
<label><span data-i="size">Array size</span><input type="range" id="size" min="20" max="300" step="10" value="120"></label>
<label><span data-i="speed">Speed</span><input type="range" id="speed" min="1" max="10" value="5"></label></section>
<section class="stats"><span data-i="ops">Comparisons</span> <b id="ops">0</b> · <span data-i="swaps">Swaps</span> <b id="swaps">0</b></section>
</aside><div class="stage"><canvas id="cv"></canvas></div></main>
<script src="app.js"></script></body></html>
